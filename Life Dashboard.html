<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap">
<style>
:root{--bg:#0B0D12;--card:#141720;--sec:#1B202B;--bd:#292F3B;--tx:#F5F5F5;--mut:#9299A8;--pu:#A78BFA;--gr:#C5F36B;--ac:#A78BFA;--red:#F87171;--am:#FBBF24;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'Plus Jakarta Sans',Inter,system-ui,sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--bd);padding:20px 12px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:16px;padding:0 12px 18px}
nav a{display:flex;gap:10px;padding:10px 12px;border-radius:10px;color:var(--mut);text-decoration:none;margin-bottom:2px}
nav a.on{background:var(--sec);color:var(--ac)}
main{padding:20px 24px;max-width:1100px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap}
h2{margin:0;font-size:20px}h3,h4{margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.grid .c{margin:0}
.big{font-size:22px;font-weight:700}.mut{color:var(--mut)}.sm{font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--sec);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;width:100%}
button{cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--sec);padding:7px 12px}
button.p{background:var(--ac);color:#0B0D12;border-color:var(--ac);font-weight:600}
button.g{background:transparent}
.bar{height:8px;background:var(--sec);border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--sec);color:var(--mut);white-space:nowrap}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.item input[type=checkbox]{width:auto}.fl{flex:1;min-width:140px}
.mb{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.md{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;width:min(440px,100%);max-height:90vh;overflow:auto;display:grid;gap:10px}
label{display:grid;gap:4px;color:var(--mut);font-size:12px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--sec);border:1px solid var(--ac);padding:10px 16px;border-radius:12px;z-index:60;display:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal button{min-height:48px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cal button.sel{border-color:var(--ac)}.cal button.td{color:var(--ac);font-weight:700}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ac);display:inline-block}
.chart{display:flex;align-items:flex-end;gap:8px;height:110px}.chart div{flex:1;text-align:center;font-size:10px;color:var(--mut)}
.chart i{display:block;margin:0 auto 2px;width:60%;border-radius:4px 4px 0 0;background:var(--ac);min-height:2px}
.demo{background:#A78BFA22;border:1px solid var(--pu);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.empty{color:var(--mut);padding:16px;text-align:center}
@media(max-width:760px){.app{display:block}aside{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;z-index:20;padding:6px;border-right:0;border-top:1px solid var(--bd)}.brand{display:none}nav{display:flex;justify-content:space-around}nav a{flex-direction:column;align-items:center;font-size:10px;padding:6px;gap:0}main{padding:14px 14px 90px}}
.hg{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}.hc{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--c);border-radius:16px;padding:28px 22px;transition:transform .2s,border-color .2s,box-shadow .2s}.hc:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 8px 28px -12px var(--c)}.hc:active{transform:scale(.98)}.hc .ic{font-size:30px;color:var(--c)}.hc h3{color:var(--c);margin:10px 0 4px}.hc p{color:var(--mut);margin:0}.fx{animation:fx .25s ease}@keyframes fx{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.tab{text-decoration:none;color:var(--mut);padding:6px 14px;border-radius:99px;background:var(--sec);font-size:13px}.tab.on{background:var(--ac);color:#0B0D12;font-weight:600}.app{display:block}aside{display:none}main{margin:0 auto;padding-bottom:40px}.hc.sel{border-color:var(--c);box-shadow:0 8px 28px -12px var(--c)}.bn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:6px;z-index:20;box-shadow:0 8px 30px #000a}.bn a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 24px;color:var(--mut);border-radius:12px;font-size:12px;text-decoration:none;transition:background .2s,color .2s}.bn a span{font-size:18px}.bn a.on{background:var(--sec);color:var(--c)}main{padding-bottom:110px}@media(max-width:760px){main{padding:14px 14px 110px}.bn a{padding:8px 18px}}
</style></head><body>
<div class="app"><aside><div class="brand">◆ Life Dashboard</div><nav id="nav"></nav></aside><main id="main"></main></div>
<div id="modal"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const off=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)},TODAY=()=>ymd(new Date());
const rp=n=>(n<0?'-':'')+'Rp'+Math.round(Math.abs(n)).toLocaleString('id-ID'),uid=()=>Math.random().toString(36).slice(2,9);
const K='lifedash_v1',PR=['Tinggi','Normal','Rendah'],PC={Tinggi:'#F87171',Normal:'#A78BFA',Rendah:'#9299A8'};
const ST=['Belum dikerjakan','Sedang dikerjakan','Selesai'],FOOD='Makanan dan Minuman';
const ECATS=[FOOD,'Transportasi','Kebutuhan Pribadi','Tagihan','Pendidikan','Pekerjaan','Hiburan','Kesehatan','Lainnya'],ICATS=['Gaji','Freelance','Fotografi atau Videografi','Bonus','Pemasukan lainnya'],CATS=[...ECATS,'Pemasukan'],WS=['Ingin dibeli','Sedang ditabung','Sudah terbeli'];
const DT='<span class="tag" style="color:var(--am)">DEMO</span>';
let S,UI={tf:'all',tv:'list',cd:TODAY(),cal:{y:new Date().getFullYear(),m:new Date().getMonth()},sel:TODAY(),q:'',ft:'all',fm:''};
function seed(){const d=1,a1=uid(),a2=uid(),T=(type,amt,cat,date,desc,x)=>({id:uid(),type,amt,cat,date,desc,note:'',d,...x});
return{set:{name:'Kamu',budget:600000},
tasks:[{id:uid(),title:'Contoh: Selesaikan laporan',desc:'Draft akhir',due:off(2),prio:'Urgent',st:'Sedang dikerjakan',d},{id:uid(),title:'Contoh: Beli bahan praktik',desc:'',due:off(5),prio:'Medium',st:'Belum dimulai',d},{id:uid(),title:'Contoh: Rapikan catatan',desc:'',due:off(-1),prio:'Low',st:'Selesai',doneAt:off(-1),d}],
checks:[{id:uid(),date:TODAY(),text:'Contoh: Olahraga pagi',done:true,d},{id:uid(),date:TODAY(),text:'Contoh: Baca 20 halaman',done:false,d}],
events:[{id:uid(),date:off(1),time:'10:00',title:'Contoh: Bimbingan online',note:'',d}],
alloc:[{id:a1,name:'Dana darurat',target:5000000,d},{id:a2,name:'Tabungan',target:3000000,d}],
tx:[T('in',3000000,'Pemasukan',off(-7),'Uang bulanan'),T('in',500000,'Pemasukan',off(-5),'Job foto'),T('out',5000,FOOD,off(-1),'Beli cilok'),T('out',18000,FOOD,off(-2),'Kopi'),T('out',15000,FOOD,off(-3),'Makan siang'),T('out',25000,'Transportasi',off(-4),'Bensin'),
T('move',500000,'Pemindahan',off(-6),'Ke Dana darurat',{from:'free',to:a1}),T('move',300000,'Pemindahan',off(-6),'Ke Tabungan',{from:'free',to:a2})],
wish:[{id:uid(),name:'Contoh: Headphone',price:450000,cat:'Elektronik',prio:'Medium',link:'',st:'Sedang ditabung',alloc:a2,d}]}}
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S)S=seed();
function save(m){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}render();if(m)toast(m)}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200);return false}
function bal(tx=S.tx){let f=0,a={};S.alloc.forEach(x=>a[x.id]=0);const add=(id,v)=>{if(id==='free')f+=v;else if(id in a)a[id]+=v};
tx.forEach(t=>{if(t.type==='in')f+=t.amt;else if(t.type==='out')f-=t.amt;else{add(t.from,-t.amt);add(t.to,t.amt)}});
return{f,a,al:Object.values(a).reduce((x,y)=>x+y,0),tot:f+Object.values(a).reduce((x,y)=>x+y,0)}}
const okTx=tx=>{const b=bal(tx);return b.f>=0&&Object.values(b.a).every(v=>v>=0)};
const mo=()=>TODAY().slice(0,7),sum=(f,m)=>S.tx.filter(t=>f(t)&&t.date.startsWith(m||mo())).reduce((s,t)=>s+t.amt,0);
const pct=(a,b)=>b>0?Math.min(100,Math.round(a/b*100)):0,aname=id=>id==='free'?'Saldo bebas':(S.alloc.find(x=>x.id===id)||{name:'(dihapus)'}).name;
const opts=a=>a.map(x=>Array.isArray(x)?x:[x,x]);
function form(title,fields,ok,hint){$('#modal').innerHTML=`<div class=mb><form class=md><h3>${title}</h3>${hint?`<div class="mut sm">${hint}</div>`:''}${fields.map(f=>`<label>${f.l}${f.t==='select'?`<select name=${f.k}>${opts(f.o).map(o=>`<option value="${esc(o[0])}"${o[0]==f.v?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`:f.t==='area'?`<textarea name=${f.k}>${esc(f.v)}</textarea>`:`<input name=${f.k} type=${f.t||'text'} value="${esc(f.v)}" ${f.r?'required':''} ${f.t==='number'?'min=0 step=any':''}>`}</label>`).join('')}<div class=row><button type=button class=g data-act=close>Batal</button><button class=p>Simpan</button></div></form></div>`;
$('#modal form').onsubmit=e=>{e.preventDefault();if(ok(Object.fromEntries(new FormData(e.target)))!==false)close()}}
function ask(html,yes,label='Ya, lanjutkan'){$('#modal').innerHTML=`<div class=mb><div class=md><h3>Konfirmasi</h3><div>${html}</div><div class=row><button class=g data-act=close>Batal</button><button class=p id=yes>${label}</button></div></div></div>`;$('#yes').onclick=()=>{close();yes()}}
const close=()=>$('#modal').innerHTML='';
// ---- parser sederhana (aturan/regex, bukan AI) ----
function parse(s){const t=s.toLowerCase().trim();let amt=0,m,raw='';
if(m=t.match(/(\d+(?:[.,]\d+)?)\s*(k|rb|ribu|jt|juta)\b/)){amt=parseFloat(m[1].replace(',','.'))*({k:1e3,rb:1e3,ribu:1e3,jt:1e6,juta:1e6}[m[2]]);raw=m[0]}
else if(m=t.match(/\d{1,3}(?:\.\d{3})+|\d{4,}/)){amt=parseInt(m[0].replace(/\./g,''));raw=m[0]}
const inc=/dapat|terima|gaji|bonus|untung|honor|dibayar|jual|pemasukan|job/.test(t)&&!/beli|bayar /.test(t);
let cat='Lainnya';if(inc)cat='Pemasukan';else if(/cilok|seblak|boba|kopi|teh|air mineral|makan|sarapan|minum|snack|camilan|jajan|bakso|mie|nasi|ayam|roti|gorengan|susu|jus/.test(t))cat=FOOD;
else if(/bensin|ojek|grab|gojek|parkir|tol|angkot/.test(t))cat='Transportasi';else if(/listrik|pulsa|kuota|wifi|air pdam|tagihan/.test(t))cat='Tagihan';else if(/nonton|game|bioskop|langganan/.test(t))cat='Hiburan';
let d=t.replace(raw,'').replace(/\brp\b/g,'').replace(/\s+/g,' ').trim();d=d.charAt(0).toUpperCase()+d.slice(1);
return{type:inc?'in':'out',amt:Math.round(amt),cat,date:TODAY(),desc:d,note:''}}
const txFields=v=>[{l:'Jenis',k:'type',t:'select',o:[['out','Pengeluaran (dari saldo bebas)'],['in','Pemasukan (ke saldo bebas)']],v:v.type},{l:'Nominal (Rp)',k:'amt',t:'number',v:v.amt,r:1},{l:'Kategori',k:'cat',t:'select',o:CATS,v:v.cat},{l:'Tanggal',k:'date',t:'date',v:v.date,r:1},{l:'Keterangan',k:'desc',v:v.desc,r:1},{l:'Catatan (opsional)',k:'note',v:v.note}];
function txForm(title,v,id,hint){form(title,txFields(v),d=>{d.amt=Math.round(+d.amt);if(!(d.amt>0)){toast('Nominal harus lebih dari 0');return false}
if(d.type==='in'&&d.cat!=='Pemasukan')d.cat='Pemasukan';if(d.type==='out'&&d.cat==='Pemasukan')d.cat='Lainnya';
const old=S.tx.find(t=>t.id===id),n=S.tx.filter(t=>t.id!==id).concat([{...old,...d,id:id||uid(),src:'free'}]);
if(!okTx(n)){toast('Saldo bebas tidak cukup untuk transaksi ini');return false}
S.tx=n;save('Transaksi disimpan')},hint)}
// ---- pages ----
const dayN=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
function chartW(){const days=[...Array(7)].map((_,i)=>off(i-6)),v=days.map(d=>S.tasks.filter(t=>t.doneAt===d).length+S.checks.filter(c=>c.date===d&&c.done).length),mx=Math.max(1,...v);
return`<div class=chart>${v.map((x,i)=>`<div><i style="height:${x/mx*80}px"></i>${x}<br>${dayN[(new Date(days[i]+'T00:00').getDay()+6)%7]}</div>`).join('')}</div>`}
function upcoming(){return[...S.events.map(e=>({date:e.date,t:(e.time||'')+' '+e.title,k:'Agenda'})),...S.tasks.filter(t=>t.st!=='Selesai'&&t.due).map(t=>({date:t.due,t:t.title,k:'Deadline'}))].filter(x=>x.date>=TODAY()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5)}
function overview(){const b=bal(),td=S.tasks.filter(t=>t.due===TODAY()),dn=td.filter(t=>t.st==='Selesai').length,ck=S.checks.filter(c=>c.date===TODAY()),cd=ck.filter(c=>c.done).length,tot=td.length+ck.length,fin=dn+cd,sp=sum(t=>t.type==='out'&&t.cat===FOOD),bg=S.set.budget;
const hasD=[S.tasks,S.checks,S.events,S.tx,S.alloc,S.wish].some(a=>a.some(x=>x.d));
return`<div class=top><div><h2>Halo, ${esc(S.set.name)} 👋</h2><div class=mut id=clock></div></div></div>
${hasD?'<div class=demo><b>Data demo aktif.</b> Angka di bawah memuat data contoh, bukan saldo asli. Hapus di <a href="#pengaturan" style="color:var(--pu)">Pengaturan</a>.</div>':''}
<h4 class=mut>Aktivitas hari ini</h4><div class=grid><div class=c><div class=mut>Total tugas &amp; checklist</div><div class=big>${tot}</div></div><div class=c><div class=mut>Selesai</div><div class=big>${fin}</div></div><div class=c><div class=mut>Belum selesai</div><div class=big>${tot-fin}</div></div><div class=c><div class=mut>Penyelesaian</div><div class=big>${pct(fin,tot)}%</div><div class=bar><i style="width:${pct(fin,tot)}%"></i></div></div></div>
<div class=c><h4>Agenda terdekat</h4>${upcoming().map(x=>`<div class=item><span class=tag>${x.k}</span><span class=fl>${esc(x.t)}</span><span class=mut>${x.date}</span></div>`).join('')||'<div class=empty>Belum ada agenda atau deadline.</div>'}</div>
<h4 class=mut>Keuangan</h4><div class=grid style="--ac:var(--gr)"><div class=c><div class=mut>Total saldo</div><div class=big>${rp(b.tot)}</div></div><div class=c><div class=mut>Saldo bebas</div><div class=big style="color:var(--gr)">${rp(b.f)}</div></div><div class=c><div class=mut>Dana alokasi</div><div class=big>${rp(b.al)}</div></div><div class=c><div class=mut>Pemasukan bulan ini</div><div class=big>${rp(sum(t=>t.type==='in'))}</div></div><div class=c><div class=mut>Pengeluaran bulan ini</div><div class=big>${rp(sum(t=>t.type==='out'))}</div></div><div class=c><div class=mut>Sisa anggaran jajan</div><div class=big style="color:${sp>bg?'var(--red)':'var(--gr)'}">${rp(bg-sp)}</div></div></div>
<div class=c><h4>Produktivitas 7 hari terakhir</h4>${chartW()}</div>`}
function tugas(){const all=[...S.tasks].sort((a,b)=>PR.indexOf(a.prio)-PR.indexOf(b.prio)||(a.due||'9').localeCompare(b.due||'9')),L=all.filter(t=>UI.tf==='all'||t.st===UI.tf);
const card=t=>`<div class=item><input type=checkbox data-act=tog data-id=${t.id} ${t.st==='Selesai'?'checked':''}><div class=fl><b style="${t.st==='Selesai'?'text-decoration:line-through;color:var(--mut)':''}">${esc(t.title)}</b> ${t.d?DT:''}<div class="mut sm">${esc(t.desc)} ${t.due?'· Deadline '+t.due:''}</div></div><span class=tag style="color:${PC[t.prio]}">${t.prio}</span><button data-act=cyc data-id=${t.id}>${t.st}</button><button class=g data-act=et data-id=${t.id}>✎</button><button class=g data-act=dt data-id=${t.id}>✕</button></div>`;
const ck=S.checks.filter(c=>c.date===UI.cd),cp=pct(ck.filter(c=>c.done).length,ck.length),dn=S.tasks.filter(t=>t.st==='Selesai').length;
return`<div class=top><h2>Tugas &amp; Aktivitas</h2><button class=p data-act=nt>+ Tugas baru</button></div>
<div class=grid><div class=c><div class=mut>Tugas selesai</div><div class=big>${pct(dn,S.tasks.length)}%</div><div class=bar><i style="width:${pct(dn,S.tasks.length)}%"></i></div></div><div class=c><div class=mut>Aktivitas selesai</div><div class=big>${dn+S.checks.filter(c=>c.done).length}</div></div><div class=c><h4>Perkembangan mingguan</h4>${chartW()}</div></div>
<div class=c><div class="row sp"><div class=row>${['all',...ST].map(s=>`<button class="${UI.tf===s?'p':''}" data-act=tf data-id="${s}">${s==='all'?'Semua':s}</button>`).join('')}</div><button data-act=tv>${UI.tv==='list'?'Tampilan papan':'Tampilan daftar'}</button></div>
${UI.tv==='list'?(L.map(card).join('')||'<div class=empty>Belum ada tugas. Klik “Tugas baru”.</div>'):`<div class=grid style="margin-top:12px">${ST.map(s=>`<div class=c style="background:var(--sec)"><h4>${s}</h4>${all.filter(t=>t.st===s).map(card).join('')||'<div class=empty>Kosong</div>'}</div>`).join('')}</div>`}</div>
<div class=c><div class="row sp"><h3>Checklist harian</h3><input type=date value="${UI.cd}" data-ch=1 style="width:auto"></div><div class=bar><i style="width:${cp}%"></i></div><div class="mut sm">${cp}% selesai</div>
${ck.map(c=>`<div class=item><input type=checkbox data-act=tc data-id=${c.id} ${c.done?'checked':''}><span class=fl>${esc(c.text)} ${c.d?DT:''}</span><button class=g data-act=ec data-id=${c.id}>✎</button><button class=g data-act=dc data-id=${c.id}>✕</button></div>`).join('')||'<div class=empty>Belum ada checklist untuk tanggal ini.</div>'}<div class=row style="margin-top:10px"><button class=p data-act=nc>+ Item checklist</button></div></div>`}
function kalender(){const{y,m}=UI.cal,n=new Date(y,m+1,0).getDate(),pad=(new Date(y,m,1).getDay()+6)%7;let cells=dayN.map(d=>`<div class="mut sm">${d}</div>`).join('')+'<span></span>'.repeat(pad);
for(let d=1;d<=n;d++){const ds=ymd(new Date(y,m,d)),k=S.tasks.filter(t=>t.due===ds&&t.st!=='Selesai').length,e=S.events.filter(x=>x.date===ds).length;
